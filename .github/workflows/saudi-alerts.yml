name: Saudi Arabia alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:         # adds a "Run workflow" button
    inputs:
      test:
        description: "Send a test notification"
        type: boolean
        default: true

permissions:
  contents: write            # lets it save state.json (which events were already sent)

concurrency:
  group: saudi-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image library
        run: pip install --quiet pillow

      - name: Check for new Saudi events
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && 'true' || 'false' }}
        run: python monitor.py

      - name: Save state
        run: |
          git config user.name "saudi-alerts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update alert state"
            git pull --rebase --quiet
            git push --quiet
          fi
